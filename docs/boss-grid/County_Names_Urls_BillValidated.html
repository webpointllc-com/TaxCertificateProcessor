<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>County Tax Collector Index — Bill Validated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f3; --border:#d5dae0;
    --text:#14181f; --sub:#5c6672; --accent:#1a5cff; --accent2:#0f9f6e; --warn:#c98500;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Poppins",system-ui,sans-serif;
    background:linear-gradient(180deg,#e9edf3 0%, #f7f8fa 40%, #f4f5f7 100%);
    color:var(--text); min-height:100vh;
  }
  header{
    padding:28px 24px 12px; text-align:center; max-width:1100px; margin:0 auto;
  }
  header h1{
    font-size:clamp(20px,3vw,28px); margin:0 0 6px; font-weight:700; letter-spacing:-0.02em;
  }
  header p{ color:var(--sub); margin:0; font-size:13px; }
  .badge{
    display:inline-block; margin-top:10px; font-size:12px; color:var(--accent2);
    background:rgba(15,159,110,0.08); border:1px solid rgba(15,159,110,0.28);
    padding:4px 10px; border-radius:999px; font-weight:600;
  }
  .search-wrap{
    max-width:1000px; margin:0 auto 8px; padding:0 20px; position:sticky; top:0; z-index:10;
    padding-top:12px; padding-bottom:12px; background:linear-gradient(var(--bg) 78%, transparent);
  }
  .search-box{
    display:flex; align-items:center; gap:10px; background:var(--panel);
    border:1px solid var(--border); border-radius:var(--radius); padding:10px 14px;
    box-shadow:0 6px 18px rgba(20,24,31,0.06);
  }
  .search-box svg{ flex-shrink:0; opacity:0.45; }
  .search-box input{
    flex:1; background:transparent; border:none; outline:none; color:var(--text);
    font-size:15px; padding:6px 0; font-family:inherit;
  }
  .search-box input::placeholder{ color:#8a93a0; }
  select#stateFilter{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; font-size:13px; outline:none; font-family:inherit;
  }
  .filter-toggle{
    background:var(--panel2); border:1px solid var(--border); color:var(--sub);
    border-radius:8px; padding:8px 12px; font-size:12.5px; cursor:pointer; white-space:nowrap;
    font-family:inherit;
  }
  .filter-toggle.active{ color:var(--warn); border-color:var(--warn); }
  .stats-row{
    max-width:1000px; margin:0 auto 6px; padding:0 20px; display:flex; justify-content:space-between;
    align-items:center; font-size:12.5px; color:var(--sub);
  }
  .stats-row .clear-btn{
    background:none; border:none; color:var(--sub); text-decoration:underline; cursor:pointer;
    font-size:12px; font-family:inherit;
  }
  main{ max-width:1100px; margin:0 auto; padding:12px 20px 40px; }
  .list-wrap{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden;
  }
  .list-header{
    display:grid; grid-template-columns:34px 220px 90px 1fr 90px 40px;
    padding:12px 18px; font-size:11px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--sub); background:var(--panel2); border-bottom:1px solid var(--border);
    align-items:center; font-weight:600;
  }
  .row{
    display:grid; grid-template-columns:34px 220px 90px 1fr 90px 40px; align-items:center;
    padding:10px 18px; border-bottom:1px solid var(--border); transition:background .1s ease;
  }
  .row:nth-child(even){ background:#fafbfc; }
  .row:last-child{ border-bottom:none; }
  .row:hover{ background:#fff7df; }
  .row.checked{ background:rgba(15,159,110,0.07); }
  .row.pinned{ background:rgba(201,133,0,0.08); box-shadow:inset 0 0 0 1px rgba(201,133,0,0.35); }
  .row input[type=checkbox]{ width:17px; height:17px; accent-color:var(--accent2); cursor:pointer; }
  .row .county{ font-weight:600; font-size:14px; }
  .row .county.done{ text-decoration:line-through; color:var(--sub); }
  .row .state{
    font-size:11px; font-weight:700; color:var(--accent);
    background:rgba(26,92,255,0.10); border-radius:6px; padding:2px 8px; width:fit-content;
  }
  .row .url{
    font-size:12.5px; color:var(--sub); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; padding-right:10px; text-decoration:none;
  }
  .row .url:hover{ color:var(--accent); text-decoration:underline; }
  .row .go{ font-size:12px; color:var(--accent2); text-align:right; text-decoration:none; font-weight:600; }
  .row .pin-btn{
    background:none; border:none; font-size:17px; cursor:pointer; color:#c5cad1; line-height:1;
  }
  .row .pin-btn.active{ color:var(--warn); }
  .empty{ text-align:center; color:var(--sub); padding:60px 20px; font-size:14px; }
  .more-note{
    text-align:center; color:var(--sub); padding:14px; font-size:12.5px; border-top:1px solid var(--border);
  }
  footer{ max-width:1000px; margin:20px auto 60px; padding:0 20px; }
  .bottom-search{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
  }
  .bottom-search summary{
    cursor:pointer; list-style:none; padding:14px 18px; display:flex; align-items:center;
    justify-content:space-between; font-size:14px; color:var(--sub); user-select:none;
  }
  .bottom-search summary::-webkit-details-marker{ display:none; }
  .bottom-search summary:after{ content:"+"; font-size:18px; color:var(--accent); }
  .bottom-search[open] summary:after{ content:"–"; }
  .bottom-search .inner{ padding:0 18px 18px; }
  .bottom-search input{
    width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:10px;
    padding:10px 14px; color:var(--text); font-size:14px; outline:none; margin-bottom:10px; font-family:inherit;
  }
  .bottom-results{ max-height:280px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .bottom-results a{
    display:flex; justify-content:space-between; gap:10px; text-decoration:none;
    color:var(--text); font-size:13px; padding:8px 10px; border-radius:8px; background:var(--panel2);
  }
  .bottom-results a:hover{ background:#e4e8ee; }
  .bottom-results span.st{ color:var(--accent); font-weight:700; font-size:11px; }
  @media (max-width:760px){
    .list-header{ display:none; }
    .row{
      grid-template-columns:24px 1fr 30px; grid-template-areas:
        "check county pin"
        "check state pin"
        "check url pin";
      row-gap:3px; padding:12px 16px;
    }
    .row input[type=checkbox]{ grid-area:check; align-self:start; }
    .row .county{ grid-area:county; }
    .row .state{ grid-area:state; }
    .row .url{ grid-area:url; white-space:normal; }
    .row .go{ display:none; }
    .row .pin-btn{ grid-area:pin; align-self:start; }
  }
</style>
</head>
<body>
  <header>
    <h1>County Tax Collecting Entity Index</h1>
    <p>Personally reviewed / Bill-validated county &amp; municipal property-tax search portals</p>
    <span class="badge" id="countBadge"></span>
  </header>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="mainSearch" type="search" placeholder="Search by county, state, or URL..." autofocus>
      <select id="stateFilter"><option value="">All States</option></select>
      <button type="button" class="filter-toggle" id="pinnedToggle">★ Pinned</button>
    </div>
  </div>
  <div class="stats-row">
    <span id="resultCount"></span>
    <button type="button" class="clear-btn" id="clearMarks">clear my marks</button>
  </div>

  <main>
    <div class="list-wrap">
      <div class="list-header">
        <span></span><span>County</span><span>State</span><span>Tax Collecting Entity URL</span><span style="text-align:right;">Open</span><span></span>
      </div>
      <div id="grid"></div>
      <div class="empty" id="emptyMsg" style="display:none;">No matches found.</div>
    </div>
  </main>

  <footer>
    <details class="bottom-search">
      <summary>Quick lookup (expand)</summary>
      <div class="inner">
        <input id="bottomSearch" type="search" placeholder="Type a county or state...">
        <div class="bottom-results" id="bottomResults"></div>
      </div>
    </details>
  </footer>

const STATES = ["AK","AL","AR","AZ","CA","CO","CT","DC","DE","FL","GA","GU","HI","IA","IL","IN","KS","KY","LA","MA","MD","ME","MI","MN","MO","MS","MT","NC","ND","NE","NH","NJ","NM","NV","NY","OH","OK","OR","PA","PR","RI","SC","SD","TN","TX","UT","VA","WA","WI","WV"];
const LS_MARKS = "spul_boss_index_marks_v1";

function loadMarks(){
  try{ return JSON.parse(localStorage.getItem(LS_MARKS) || "{}"); }
  catch(e){ return {}; }
}
function saveMarks(marks){
  try{ localStorage.setItem(LS_MARKS, JSON.stringify(marks)); }catch(e){}
}
let marks = loadMarks();

const grid = document.getElementById('grid');
const mainSearch = document.getElementById('mainSearch');
const stateFilter = document.getElementById('stateFilter');
const emptyMsg = document.getElementById('emptyMsg');
const resultCount = document.getElementById('resultCount');
const countBadge = document.getElementById('countBadge');
const bottomSearch = document.getElementById('bottomSearch');
const bottomResults = document.getElementById('bottomResults');
const pinnedToggle = document.getElementById('pinnedToggle');
const clearMarksBtn = document.getElementById('clearMarks');
let pinnedOnly = false;

countBadge.textContent = DATA.length.toLocaleString() + ' validated entries';
STATES.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s; opt.textContent = s;
  stateFilter.appendChild(opt);
});

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function markFor(id){ return marks[id] || {checked:false, pinned:false}; }

function render(){
  const q = mainSearch.value.trim().toLowerCase();
  const st = stateFilter.value;
  let results = DATA;
  if(st) results = results.filter(r => r.state === st);
  if(q) results = results.filter(r =>
    r.county.toLowerCase().includes(q) ||
    r.state.toLowerCase().includes(q) ||
    r.url.toLowerCase().includes(q)
  );
  if(pinnedOnly) results = results.filter(r => markFor(r.id).pinned);
  resultCount.textContent = results.length.toLocaleString() + ' result' + (results.length===1?'':'s');
  if(results.length === 0){
    grid.innerHTML = '';
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';
  const LIMIT = 800;
  const shown = results.slice(0, LIMIT);
  grid.innerHTML = shown.map(r => {
    const m = markFor(r.id);
    return `
    <div class="row ${m.checked?'checked':''} ${m.pinned?'pinned':''}" data-id="${escapeHtml(r.id)}">
      <input type="checkbox" class="mk-check" ${m.checked?'checked':''} aria-label="mark done">
      <span class="county ${m.checked?'done':''}">${escapeHtml(r.county)}</span>
      <span class="state">${escapeHtml(r.state)}</span>
      <a class="url" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.url)}</a>
      <a class="go" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">Open →</a>
      <button type="button" class="pin-btn ${m.pinned?'active':''}" title="Pin / highlight">★</button>
    </div>`;
  }).join('');
  if(results.length > LIMIT){
    const note = document.createElement('div');
    note.className = 'more-note';
    note.textContent = `Showing first ${LIMIT} of ${results.length.toLocaleString()} — narrow your search to see more.`;
    grid.appendChild(note);
  }
}

grid.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if(!row) return;
  const id = row.dataset.id;
  if(e.target.classList.contains('mk-check')){
    const m = markFor(id);
    m.checked = e.target.checked;
    marks[id] = m; saveMarks(marks);
    row.classList.toggle('checked', m.checked);
    row.querySelector('.county').classList.toggle('done', m.checked);
    return;
  }
  if(e.target.classList.contains('pin-btn')){
    const m = markFor(id);
    m.pinned = !m.pinned;
    marks[id] = m; saveMarks(marks);
    row.classList.toggle('pinned', m.pinned);
    e.target.classList.toggle('active', m.pinned);
    if(pinnedOnly) render();
  }
});

mainSearch.addEventListener('input', render);
stateFilter.addEventListener('change', render);
pinnedToggle.addEventListener('click', () => {
  pinnedOnly = !pinnedOnly;
  pinnedToggle.classList.toggle('active', pinnedOnly);
  render();
});
clearMarksBtn.addEventListener('click', () => {
  if(confirm('Clear all checkmarks and pins on this device?')){
    marks = {}; saveMarks(marks); render();
  }
});
bottomSearch.addEventListener('input', () => {
  const q = bottomSearch.value.trim().toLowerCase();
  if(!q){ bottomResults.innerHTML = ''; return; }
  const results = DATA.filter(r =>
    r.county.toLowerCase().includes(q) || r.state.toLowerCase().includes(q)
  ).slice(0, 40);
  bottomResults.innerHTML = results.map(r => `
    <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener">
      <span>${escapeHtml(r.county)}</span><span class="st">${escapeHtml(r.state)}</span>
    </a>
  `).join('') || '<div style="color:var(--sub);font-size:13px;padding:6px;">No matches.</div>';
});
render();
</script>
