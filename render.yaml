# WebPoint Tax Certificate Processor — Render Blueprint
#
# Launch stack (do not use Free web or Free Postgres):
#   • Web Starter $7/mo  — always-on, no 15-minute spin-down inside Squarespace
#   • Postgres Basic 256MB $7/mo — durable chat, feedback, accounts, county-agent memory
#   • Groq Llama 3.3 70B — workhorse LLM (key in Dashboard, never git)
# Anthropic / Google / Apple keys are added in the Dashboard later.
# Do not replace this Blueprint with greenfield AWS this month.
# ALB + Fargate + RDS + NAT is $45-90/mo vs this stack at $14/mo.
# Dockerfile is the later host swap onto idle AWS, not a product rewrite.
#
# Apply: https://dashboard.render.com/blueprint/new?repo=https://github.com/webpointllc-com/TaxCertificateProcessor
# Pay first: https://dashboard.render.com/billing

databases:
  - name: webpoint-tcs-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: tax-certificate-processor
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MODEL_PROVIDER
        value: groq
      - key: DATABASE_URL
        fromDatabase:
          name: webpoint-tcs-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      # Own model (RunPod serverless vLLM). Leave unset until the endpoint exists.
      # Switch day: set these three, then change MODEL_PROVIDER to webpoint. Groq stays as fallback.
      - key: WEBPOINT_LLM_URL
        sync: false
      - key: WEBPOINT_LLM_KEY
        sync: false
      - key: WEBPOINT_MODEL
        value: webpoint
