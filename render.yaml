# Historical — Render free proto only. Production = AWS (docs/aws/LIGHTSAIL_MINIMAL.md).
services:
  - type: web
    name: search-spul-minimal
    runtime: node
    plan: free
    rootDir: spul
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
