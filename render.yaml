databases:
  - name: ijf-postgres
    databaseName: ijf
    user: ijf
    plan: free

services:
  - type: web
    name: ijf-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: ijf-postgres
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        value: "*"

  - type: web
    name: ijf-frontend
    runtime: static
    plan: free
    autoDeploy: true
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: ALLOWALL
