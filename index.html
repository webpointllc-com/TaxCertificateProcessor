<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>I Just Farted — Beta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#fff;overflow:hidden}
.header{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:1000;border-bottom:1px solid rgba(255,255,255,0.1)}
.hamburger{width:28px;height:24px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;z-index:1001;padding:0}
.hamburger span{width:100%;height:3px;background:#fff;display:block;border-radius:2px;transition:0.3s}
.hamburger.active span:nth-child(1){transform:rotate(45deg) translate(6px,6px)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(6px,-6px)}
.logo{font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:8px}
.menu{position:fixed;top:0;left:-300px;width:280px;height:100vh;background:rgba(26,26,46,0.98);backdrop-filter:blur(20px);box-shadow:2px 0 30px rgba(0,0,0,0.3);transition:0.32s cubic-bezier(.2,.9,.2,1);z-index:999;padding-top:70px}
.menu.open{left:0}
.menu-item{padding:18px 24px;border-bottom:1px solid rgba(255,255,255,0.08);cursor:pointer;font-size:1rem;color:rgba(255,255,255,0.85);transition:0.2s;display:flex;align-items:center;gap:12px}
.menu-item:hover{background:rgba(255,255,255,0.1);color:#fff}
.menu-overlay{position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(0,0,0,0.5);opacity:0;pointer-events:none;z-index:998;transition:0.3s}
.menu-overlay.show{opacity:1;pointer-events:auto}
#main-container{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:70px 20px 20px;overflow-y:auto}
.status-section{width:100%;max-width:360px;background:rgba(255,255,255,0.08);border-radius:16px;padding:16px 20px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.1)}
.status-label{display:flex;align-items:center;justify-content:space-between;font-size:0.95rem;color:rgba(255,255,255,0.7)}
.status-indicator{width:10px;height:10px;border-radius:50%;background:#666;transition:0.3s;margin-left:8px}
.status-indicator.active{background:#00d084;box-shadow:0 0 15px #00d084;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.toggle-container{margin-top:12px;display:flex;justify-content:center}
.toggle-switch{position:relative;width:100px;height:50px;cursor:pointer;user-select:none}
.toggle-switch input{display:none}
.slider{position:absolute;inset:0;background:rgba(255,255,255,0.15);border-radius:25px;transition:0.28s}
.slider::before{content:'';position:absolute;width:42px;height:42px;left:4px;bottom:4px;background:white;border-radius:50%;transition:0.28s;box-shadow:0 3px 10px rgba(0,0,0,0.3)}
input:checked+.slider{background:#00d084}
input:checked+.slider::before{transform:translateX(50px)}
.button-section{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:280px;position:relative}
#easy-button{width:200px;height:200px;background:linear-gradient(145deg,#ff4757,#ff3344);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;color:white;cursor:pointer;box-shadow:0 8px 30px rgba(255,71,87,0.5),inset 0 -4px 10px rgba(0,0,0,0.2),inset 0 4px 10px rgba(255,255,255,0.2);transition:0.2s;user-select:none;text-shadow:0 2px 4px rgba(0,0,0,0.3);position:relative;z-index:10}
#easy-button.disabled{background:linear-gradient(145deg,#555,#444);box-shadow:0 4px 15px rgba(0,0,0,0.3);cursor:not-allowed;opacity:0.6}
#easy-button:not(.disabled):active{transform:scale(0.95);box-shadow:0 4px 15px rgba(255,71,87,0.4)}
#fart-animation{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,200,50,0.5) 0%,rgba(255,200,50,0) 70%);pointer-events:none;z-index:5;display:none}
.report-section{width:100%;max-width:360px;margin-top:auto;padding-bottom:10px}
.report-button{width:100%;padding:16px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);border:2px solid rgba(255,255,255,0.2);border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:0.24s}
.report-button:not(.disabled):hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3);color:#fff}
.report-button.disabled{opacity:0.4;cursor:not-allowed}
#map-container{position:fixed;bottom:20px;right:20px;width:200px;height:200px;border-radius:16px;overflow:hidden;opacity:0;transform:scale(0.8) translateY(20px);transition:all 0.4s cubic-bezier(.2,.9,.2,1);z-index:100;box-shadow:0 10px 40px rgba(0,0,0,0.4);border:2px solid rgba(255,255,255,0.2);pointer-events:none}
#map-container.show{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
#map{width:100%;height:100%}
.map-close{position:absolute;top:8px;right:8px;width:28px;height:28px;border:none;background:rgba(0,0,0,0.7);color:white;border-radius:50%;cursor:pointer;z-index:1000;font-size:16px;display:flex;align-items:center;justify-content:center}
.notification{position:fixed;top:70px;right:16px;background:rgba(255,255,255,0.95);padding:14px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.2);transform:translateX(400px);transition:0.32s cubic-bezier(.2,.9,.2,1);z-index:2000;font-size:0.95rem;color:#333;max-width:300px}
.notification.show{transform:translateX(0)}
.notification.success{border-left:4px solid #00d084}
.notification.error{border-left:4px solid #ff4444}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:3000;padding:20px}
.modal.show{display:flex}
.modal-content{background:#1a1a2e;padding:24px;border-radius:16px;width:100%;max-width:340px;border:1px solid rgba(255,255,255,0.1)}
.modal-content h3{margin-bottom:16px;font-size:1.2rem}
.modal-content input,.modal-content textarea{width:100%;padding:14px;border:2px solid rgba(255,255,255,0.15);border-radius:10px;margin-bottom:12px;font-size:1rem;background:rgba(255,255,255,0.08);color:#fff}
.modal-content input::placeholder,.modal-content textarea::placeholder{color:rgba(255,255,255,0.4)}
.modal-content input:focus,.modal-content textarea:focus{outline:none;border-color:#00d084}
.modal-buttons{display:flex;gap:12px;margin-top:8px}
.modal-btn{flex:1;padding:14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:1rem;transition:0.2s}
.modal-btn.cancel{background:rgba(255,255,255,0.1);color:#fff}
.modal-btn.confirm{background:#00d084;color:white}
.friends-list{max-height:300px;overflow-y:auto;margin-bottom:12px}
.friend-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1)}
.friend-info{flex:1}
.friend-name{font-weight:600}
.friend-status{font-size:0.85rem;color:rgba(255,255,255,0.5);margin-top:2px}
.friend-status.online{color:#00d084;font-weight:600}
.remove-friend{background:#ff4444;color:white;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:0.85rem;font-weight:600}
.no-friends{text-align:center;padding:30px;color:rgba(255,255,255,0.5)}
.fart-counter{text-align:center;margin-top:12px;font-size:0.9rem;color:rgba(255,255,255,0.6)}
.fart-counter strong{color:#00d084;font-size:1.1rem}
@media(max-width:400px){#easy-button{width:160px;height:160px;font-size:1.5rem}.status-section,.report-section{max-width:100%}#map-container{width:150px;height:150px;bottom:15px;right:15px}}
</style>
</head>
<body>

<div class="header">
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
  <div class="logo"><span>💨</span><span>I Just Farted</span></div>
  <div style="width:28px;"></div>
</div>

<div class="menu" id="menu">
  <div class="menu-item" id="menu-add-friend"><span>👥</span> Add Friends</div>
  <div class="menu-item" id="menu-friends"><span>📋</span> Friends List</div>
  <div class="menu-item" id="menu-history"><span>📍</span> Fart History</div>
  <div class="menu-item" id="menu-clear"><span>🗑️</span> Clear History</div>
  <div class="menu-item" id="menu-about"><span>ℹ️</span> About</div>
</div>
<div class="menu-overlay" id="menu-overlay"></div>

<div id="main-container">
  <div class="status-section">
    <div class="status-label">
      <span>Stream Status: <strong id="status-text">Offline</strong></span>
      <span class="status-indicator" id="status-dot"></span>
    </div>
    <div class="toggle-container">
      <label class="toggle-switch">
        <input type="checkbox" id="status-toggle">
        <div class="slider"></div>
      </label>
    </div>
  </div>

  <div class="button-section">
    <div id="easy-button" class="disabled">FART</div>
    <div id="fart-animation"></div>
    <div class="fart-counter">Total Farts: <strong id="fart-count">0</strong></div>
  </div>

  <div class="report-section">
    <button class="report-button disabled" id="report-btn">📝 Report a Fart Sighting</button>
  </div>
</div>

<div id="map-container">
  <button class="map-close" id="map-close">✕</button>
  <div id="map"></div>
</div>

<div class="notification" id="notification"></div>

<div class="modal" id="add-friend-modal">
  <div class="modal-content">
    <h3>👥 Add Friend</h3>
    <input type="text" id="friend-username" placeholder="Enter username or code">
    <div class="modal-buttons">
      <button class="modal-btn cancel" id="add-friend-cancel">Cancel</button>
      <button class="modal-btn confirm" id="add-friend-confirm">Add</button>
    </div>
  </div>
</div>

<div class="modal" id="friends-modal">
  <div class="modal-content">
    <h3>📋 Friends List</h3>
    <div class="friends-list" id="friends-list"></div>
    <div class="modal-buttons">
      <button class="modal-btn cancel" id="friends-close">Close</button>
    </div>
  </div>
</div>

<div class="modal" id="report-modal">
  <div class="modal-content">
    <h3>📝 Report Fart</h3>
    <textarea id="report-text" placeholder="Describe the incident..." rows="3"></textarea>
    <input type="file" id="report-photo" accept="image/*">
    <div class="modal-buttons">
      <button class="modal-btn cancel" id="report-cancel">Cancel</button>
      <button class="modal-btn confirm" id="report-confirm">Submit</button>
    </div>
  </div>
</div>

<div class="modal" id="history-modal">
  <div class="modal-content">
    <h3>📍 Fart History</h3>
    <div class="friends-list" id="history-list"></div>
    <div class="modal-buttons">
      <button class="modal-btn cancel" id="history-close">Close</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function() {
  'use strict';
  
  // DOM Elements
  var hamburger = document.getElementById('hamburger');
  var menu = document.getElementById('menu');
  var menuOverlay = document.getElementById('menu-overlay');
  var toggle = document.getElementById('status-toggle');
  var statusText = document.getElementById('status-text');
  var statusDot = document.getElementById('status-dot');
  var easyButton = document.getElementById('easy-button');
  var fartAnim = document.getElementById('fart-animation');
  var mapContainer = document.getElementById('map-container');
  var mapClose = document.getElementById('map-close');
  var reportBtn = document.getElementById('report-btn');
  var notification = document.getElementById('notification');
  var fartCountEl = document.getElementById('fart-count');
  
  // State
  var isActive = false;
  var map = null;
  var markersLayer = null;
  var lastPressTime = 0;
  var notifTimer = null;
  
  // Storage
  var PINS_KEY = 'ijf_pins_v1';
  var FRIENDS_KEY = 'ijf_friends_v1';
  
  // ========== MENU ==========
  hamburger.addEventListener('click', function(e) {
    e.stopPropagation();
    hamburger.classList.toggle('active');
    menu.classList.toggle('open');
    menuOverlay.classList.toggle('show');
  });
  
  menuOverlay.addEventListener('click', closeMenu);
  
  function closeMenu() {
    hamburger.classList.remove('active');
    menu.classList.remove('open');
    menuOverlay.classList.remove('show');
  }
  
  // Menu items
  document.getElementById('menu-add-friend').addEventListener('click', function() {
    closeMenu();
    document.getElementById('friend-username').value = '';
    document.getElementById('add-friend-modal').classList.add('show');
  });
  
  document.getElementById('menu-friends').addEventListener('click', function() {
    closeMenu();
    renderFriends();
    document.getElementById('friends-modal').classList.add('show');
  });
  
  document.getElementById('menu-history').addEventListener('click', function() {
    closeMenu();
    renderHistory();
    document.getElementById('history-modal').classList.add('show');
  });
  
  document.getElementById('menu-clear').addEventListener('click', function() {
    closeMenu();
    if (confirm('Clear all fart history?')) {
      localStorage.setItem(PINS_KEY, '[]');
      updateFartCount();
      showNotification('🗑️ History cleared', 'success');
    }
  });
  
  document.getElementById('menu-about').addEventListener('click', function() {
    closeMenu();
    showNotification('💨 I Just Farted v1.0 Beta', 'success');
  });
  
  // ========== STATUS TOGGLE ==========
  toggle.addEventListener('change', function() {
    isActive = this.checked;
    statusText.textContent = isActive ? 'Live' : 'Offline';
    statusDot.classList.toggle('active', isActive);
    easyButton.classList.toggle('disabled', !isActive);
    reportBtn.classList.toggle('disabled', !isActive);
    showNotification(isActive ? '🟢 You are now LIVE!' : '⚫ You are now offline', isActive ? 'success' : 'error');
    if (isActive && navigator.vibrate) navigator.vibrate([50, 50, 50]);
  });
  
  // ========== FART BUTTON ==========
  easyButton.addEventListener('click', function(e) {
    e.preventDefault();
    if (!isActive) {
      showNotification('Turn on Live status first!', 'error');
      return;
    }
    var now = Date.now();
    if (now - lastPressTime < 500) return;
    lastPressTime = now;
    triggerFartAnimation();
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    broadcastFart();
  });
  
  function triggerFartAnimation() {
    var btn = easyButton.getBoundingClientRect();
    var centerX = btn.left + btn.width / 2;
    var centerY = btn.top + btn.height / 2;
    
    fartAnim.style.display = 'block';
    fartAnim.style.width = '50px';
    fartAnim.style.height = '50px';
    fartAnim.style.left = (centerX - 25) + 'px';
    fartAnim.style.top = (centerY - 25) + 'px';
    fartAnim.style.opacity = '1';
    
    var size = 50;
    var interval = setInterval(function() {
      size += 15;
      fartAnim.style.width = size + 'px';
      fartAnim.style.height = size + 'px';
      fartAnim.style.left = (centerX - size/2) + 'px';
      fartAnim.style.top = (centerY - size/2) + 'px';
      fartAnim.style.opacity = Math.max(0, 1 - size / 350);
      if (size > 350) {
        clearInterval(interval);
        fartAnim.style.display = 'none';
      }
    }, 25);
  }
  
  function broadcastFart() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var pin = {
            id: Date.now(),
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            timestamp: Date.now(),
            type: 'broadcast',
            note: ''
          };
          savePin(pin);
          updateFartCount();
          showMiniMap(pin);
          notifyFriends();
          showNotification('💨 Fart broadcasted!', 'success');
        },
        function() {
          var pin = {
            id: Date.now(),
            lat: null,
            lng: null,
            timestamp: Date.now(),
            type: 'broadcast',
            note: 'Location unavailable'
          };
          savePin(pin);
          updateFartCount();
          showNotification('💨 Fart saved (no location)', 'success');
        },
        { timeout: 10000, enableHighAccuracy: false }
      );
    } else {
      showNotification('Geolocation not supported', 'error');
    }
  }
  
  // ========== MAP ==========
  function initMap(lat, lng) {
    if (map) {
      map.remove();
      map = null;
    }
    map = L.map('map', {
      center: [lat, lng],
      zoom: 15,
      zoomControl: false,
      attributionControl: false
    });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);
  }
  
  function showMiniMap(pin) {
    if (!pin.lat || !pin.lng) return;
    initMap(pin.lat, pin.lng);
    var pins = loadPins().filter(function(p) { return p.lat && p.lng; });
    pins.forEach(function(p) {
      var color = p.type === 'report' ? '#ff4444' : '#00d084';
      var icon = L.divIcon({
        html: '<div style="width:14px;height:14px;border-radius:50%;background:' + color + ';border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>',
        className: '',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
      L.marker([p.lat, p.lng], { icon: icon }).addTo(markersLayer);
    });
    mapContainer.classList.add('show');
    setTimeout(function() {
      if (map) map.invalidateSize();
    }, 400);
    setTimeout(function() {
      mapContainer.classList.remove('show');
    }, 8000);
  }
  
  mapClose.addEventListener('click', function() {
    mapContainer.classList.remove('show');
  });
  
  // ========== STORAGE ==========
  function loadPins() {
    try { return JSON.parse(localStorage.getItem(PINS_KEY) || '[]'); }
    catch(e) { return []; }
  }
  
  function savePins(pins) {
    localStorage.setItem(PINS_KEY, JSON.stringify(pins));
  }
  
  function savePin(pin) {
    var pins = loadPins();
    pins.push(pin);
    savePins(pins);
  }
  
  function loadFriends() {
    try { return JSON.parse(localStorage.getItem(FRIENDS_KEY) || '[]'); }
    catch(e) { return []; }
  }
  
  function saveFriends(friends) {
    localStorage.setItem(FRIENDS_KEY, JSON.stringify(friends));
  }
  
  function updateFartCount() {
    fartCountEl.textContent = loadPins().length;
  }
  
  // ========== NOTIFICATIONS ==========
  function showNotification(msg, type) {
    notification.textContent = msg;
    notification.className = 'notification ' + (type || 'success') + ' show';
    clearTimeout(notifTimer);
    notifTimer = setTimeout(function() {
      notification.classList.remove('show');
    }, 3000);
  }
  
  // ========== FRIENDS ==========
  document.getElementById('add-friend-cancel').addEventListener('click', function() {
    document.getElementById('add-friend-modal').classList.remove('show');
  });
  
  document.getElementById('add-friend-confirm').addEventListener('click', function() {
    var username = document.getElementById('friend-username').value.trim();
    if (!username) {
      showNotification('Please enter a username', 'error');
      return;
    }
    var friends = loadFriends();
    if (friends.some(function(f) { return f.username.toLowerCase() === username.toLowerCase(); })) {
      showNotification('Friend already added', 'error');
      return;
    }
    friends.push({
      id: Date.now(),
      username: username,
      online: Math.random() > 0.5,
      addedAt: Date.now()
    });
    saveFriends(friends);
    document.getElementById('add-friend-modal').classList.remove('show');
    showNotification('👥 ' + username + ' added!', 'success');
  });
  
  document.getElementById('friends-close').addEventListener('click', function() {
    document.getElementById('friends-modal').classList.remove('show');
  });
  
  function renderFriends() {
    var friends = loadFriends();
    var list = document.getElementById('friends-list');
    if (friends.length === 0) {
      list.innerHTML = '<div class="no-friends">No friends yet. Add some!</div>';
      return;
    }
    list.innerHTML = friends.map(function(f) {
      return '<div class="friend-item"><div class="friend-info"><div class="friend-name">' + 
        escapeHtml(f.username) + '</div><div class="friend-status ' + (f.online ? 'online' : '') + '">' + 
        (f.online ? '🟢 Online' : '⚫ Offline') + '</div></div>' +
        '<button class="remove-friend" data-id="' + f.id + '">Remove</button></div>';
    }).join('');
    
    list.querySelectorAll('.remove-friend').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id = parseInt(this.getAttribute('data-id'));
        var friends = loadFriends().filter(function(f) { return f.id !== id; });
        saveFriends(friends);
        renderFriends();
        showNotification('Friend removed', 'success');
      });
    });
  }
  
  function notifyFriends() {
    var friends = loadFriends();
    var online = friends.filter(function(f) { return f.online; });
    if (online.length > 0) {
      setTimeout(function() {
        showNotification('📢 Notified ' + online.length + ' friend' + (online.length > 1 ? 's' : '') + '!', 'success');
      }, 1500);
    }
  }
  
  // ========== REPORT ==========
  reportBtn.addEventListener('click', function() {
    if (!isActive) {
      showNotification('Turn on Live status first!', 'error');
      return;
    }
    document.getElementById('report-text').value = '';
    document.getElementById('report-photo').value = '';
    document.getElementById('report-modal').classList.add('show');
  });
  
  document.getElementById('report-cancel').addEventListener('click', function() {
    document.getElementById('report-modal').classList.remove('show');
  });
  
  document.getElementById('report-confirm').addEventListener('click', function() {
    var text = document.getElementById('report-text').value.trim();
    var file = document.getElementById('report-photo').files[0];
    if (!text && !file) {
      showNotification('Add a note or photo', 'error');
      return;
    }
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          var pin = {
            id: Date.now(),
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            timestamp: Date.now(),
            type: 'report',
            note: text || 'Fart sighting reported'
          };
          savePin(pin);
          updateFartCount();
          document.getElementById('report-modal').classList.remove('show');
          showMiniMap(pin);
          showNotification('📝 Report submitted!', 'success');
        },
        function() {
          var pin = {
            id: Date.now(),
            lat: null,
            lng: null,
            timestamp: Date.now(),
            type: 'report',
            note: text || 'Fart sighting reported'
          };
          savePin(pin);
          updateFartCount();
          document.getElementById('report-modal').classList.remove('show');
          showNotification('📝 Report saved (no location)', 'success');
        }
      );
    }
  });
  
  // ========== HISTORY ==========
  document.getElementById('history-close').addEventListener('click', function() {
    document.getElementById('history-modal').classList.remove('show');
  });
  
  function renderHistory() {
    var pins = loadPins().reverse().slice(0, 50);
    var list = document.getElementById('history-list');
    if (pins.length === 0) {
      list.innerHTML = '<div class="no-friends">No farts recorded yet!</div>';
      return;
    }
    list.innerHTML = pins.map(function(p) {
      var date = new Date(p.timestamp);
      var emoji = p.type === 'report' ? '📝' : '💨';
      var loc = (p.lat && p.lng) ? p.lat.toFixed(4) + ', ' + p.lng.toFixed(4) : 'No location';
      return '<div class="friend-item"><div class="friend-info">' +
        '<div class="friend-name">' + emoji + ' ' + (p.type === 'report' ? 'Report' : 'Broadcast') + '</div>' +
        '<div class="friend-status">' + date.toLocaleString() + '</div>' +
        '<div class="friend-status">' + loc + '</div>' +
        (p.note ? '<div class="friend-status">"' + escapeHtml(p.note) + '"</div>' : '') +
        '</div></div>';
    }).join('');
  }
  
  // ========== UTILS ==========
  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  // ========== INIT ==========
  updateFartCount();
  statusDot.classList.remove('active');
  easyButton.classList.add('disabled');
  reportBtn.classList.add('disabled');
  
  setTimeout(function() {
    showNotification('👋 Welcome! Turn on Live to start', 'success');
  }, 500);
  
})();
</script>
</body>
</html>
