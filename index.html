<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I Just Farted — Beta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root {
  --primary: #ff4757;
  --primary-dark: #ff3344;
  --success: #00d084;
  --error: #ff4444;
  --bg-dark: #1a1a2e;
  --bg-mid: #16213e;
  --bg-light: #0f3460;
  --text: #ffffff;
  --text-muted: rgba(255,255,255,0.6);
  --glass: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.1);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { 
  width:100%; height:100%; 
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; 
  background:linear-gradient(135deg,var(--bg-dark),var(--bg-mid),var(--bg-light));
  color:var(--text); overflow:hidden;
}

/* Header */
.header {
  position:fixed; top:0; left:0; right:0; height:56px;
  background:var(--glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; z-index:1000; border-bottom:1px solid var(--glass-border);
}
.hamburger {
  width:24px; height:20px; display:flex; flex-direction:column;
  justify-content:space-between; cursor:pointer; z-index:1001;
}
.hamburger span { width:100%; height:2px; background:#fff; border-radius:2px; transition:0.3s; }
.hamburger.active span:nth-child(1) { transform:rotate(45deg) translate(6px,6px); }
.hamburger.active span:nth-child(2) { opacity:0; }
.hamburger.active span:nth-child(3) { transform:rotate(-45deg) translate(6px,-6px); }
.logo { font-size:1.15rem; font-weight:700; display:flex; align-items:center; gap:8px; }

/* Menu */
.menu {
  position:fixed; top:0; left:0; width:280px; height:100vh;
  background:rgba(26,26,46,0.98); backdrop-filter:blur(20px);
  transform:translateX(-100%); transition:transform 0.3s ease;
  z-index:999; padding-top:70px;
}
.menu.open { transform:translateX(0); }
.menu-item {
  padding:16px 24px; border-bottom:1px solid var(--glass-border);
  cursor:pointer; font-size:1rem; color:var(--text-muted);
  display:flex; align-items:center; gap:12px; transition:0.2s;
}
.menu-item:hover, .menu-item:active { background:var(--glass); color:#fff; }
.menu-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.5); opacity:0; pointer-events:none;
  z-index:998; transition:0.3s;
}
.menu-overlay.show { opacity:1; pointer-events:auto; }

/* Main */
.main {
  width:100%; height:100%; display:flex; flex-direction:column;
  align-items:center; padding:70px 20px 20px; overflow-y:auto;
}

/* Status Card */
.status-card {
  width:100%; max-width:360px; background:var(--glass);
  border-radius:16px; padding:20px; margin-bottom:20px;
  border:1px solid var(--glass-border);
}
.status-row {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px;
}
.status-label { font-size:0.95rem; color:var(--text-muted); }
.status-value { font-weight:700; display:flex; align-items:center; gap:8px; }
.status-dot {
  width:10px; height:10px; border-radius:50%; background:#666; transition:0.3s;
}
.status-dot.active { background:var(--success); box-shadow:0 0 12px var(--success); }
.toggle {
  position:relative; width:60px; height:32px; cursor:pointer;
  background:rgba(255,255,255,0.15); border-radius:16px; transition:0.3s;
}
.toggle.active { background:var(--success); }
.toggle-knob {
  position:absolute; top:3px; left:3px; width:26px; height:26px;
  background:#fff; border-radius:50%; transition:0.3s;
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
}
.toggle.active .toggle-knob { left:31px; }

/* Fart Button */
.button-area {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; position:relative;
  width:100%; min-height:300px;
}
.fart-btn {
  width:180px; height:180px; border-radius:50%; border:none;
  background:linear-gradient(145deg,var(--primary),var(--primary-dark));
  color:#fff; font-size:1.6rem; font-weight:800; cursor:pointer;
  box-shadow:0 8px 30px rgba(255,71,87,0.5),
    inset 0 -4px 10px rgba(0,0,0,0.2),
    inset 0 4px 10px rgba(255,255,255,0.2);
  transition:0.15s; user-select:none; position:relative; z-index:10;
}
.fart-btn:active:not(.disabled) { transform:scale(0.94); }
.fart-btn.disabled {
  background:linear-gradient(145deg,#444,#333);
  box-shadow:0 4px 15px rgba(0,0,0,0.3);
  cursor:not-allowed; opacity:0.5;
}
.fart-ring {
  position:absolute; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle,rgba(255,200,50,0.5),transparent 70%);
  opacity:0; transform:scale(0);
}
.fart-counter {
  margin-top:16px; font-size:0.9rem; color:var(--text-muted); text-align:center;
}
.fart-counter strong { color:var(--success); font-size:1.1rem; }

/* Report Button */
.report-btn {
  width:100%; max-width:360px; padding:14px; margin-top:auto;
  background:var(--glass); color:var(--text-muted);
  border:2px solid var(--glass-border); border-radius:12px;
  font-size:1rem; font-weight:600; cursor:pointer; transition:0.2s;
}
.report-btn:hover:not(.disabled) { background:rgba(255,255,255,0.12); color:#fff; }
.report-btn.disabled { opacity:0.4; cursor:not-allowed; }

/* Mini Map */
.minimap {
  position:fixed; bottom:20px; right:20px; width:200px; height:200px;
  border-radius:16px; overflow:hidden; z-index:100;
  box-shadow:0 10px 40px rgba(0,0,0,0.5); border:2px solid var(--glass-border);
  opacity:0; transform:scale(0.8) translateY(20px);
  transition:all 0.4s cubic-bezier(.2,.9,.2,1); pointer-events:none;
}
.minimap.show { opacity:1; transform:scale(1) translateY(0); pointer-events:auto; }
.minimap-close {
  position:absolute; top:8px; right:8px; width:28px; height:28px;
  background:rgba(0,0,0,0.7); color:#fff; border:none; border-radius:50%;
  font-size:16px; cursor:pointer; z-index:101;
  display:flex; align-items:center; justify-content:center;
}
#map { width:100%; height:100%; }

/* Toast */
.toast {
  position:fixed; top:70px; right:16px; max-width:300px;
  background:#fff; color:#333; padding:14px 18px; border-radius:12px;
  box-shadow:0 8px 30px rgba(0,0,0,0.2); font-size:0.95rem;
  transform:translateX(400px); transition:0.3s cubic-bezier(.2,.9,.2,1); z-index:2000;
}
.toast.show { transform:translateX(0); }
.toast.success { border-left:4px solid var(--success); }
.toast.error { border-left:4px solid var(--error); }

/* Modal */
.modal {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.6); display:flex; align-items:center;
  justify-content:center; z-index:3000; padding:20px;
  opacity:0; pointer-events:none; transition:0.3s;
}
.modal.show { opacity:1; pointer-events:auto; }
.modal-box {
  background:var(--bg-dark); padding:24px; border-radius:16px;
  width:100%; max-width:340px; border:1px solid var(--glass-border);
  transform:scale(0.9); transition:0.3s;
}
.modal.show .modal-box { transform:scale(1); }
.modal-title { font-size:1.2rem; font-weight:700; margin-bottom:16px; }
.modal-input {
  width:100%; padding:14px; margin-bottom:12px;
  background:var(--glass); border:2px solid var(--glass-border);
  border-radius:10px; color:#fff; font-size:1rem;
}
.modal-input:focus { outline:none; border-color:var(--success); }
.modal-input::placeholder { color:var(--text-muted); }
.modal-actions { display:flex; gap:12px; margin-top:16px; }
.modal-btn {
  flex:1; padding:14px; border:none; border-radius:10px;
  font-size:1rem; font-weight:700; cursor:pointer; transition:0.2s;
}
.modal-btn.cancel { background:var(--glass); color:#fff; }
.modal-btn.confirm { background:var(--success); color:#fff; }

/* List */
.list { max-height:280px; overflow-y:auto; }
.list-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 0; border-bottom:1px solid var(--glass-border);
}
.list-info { flex:1; }
.list-title { font-weight:600; margin-bottom:2px; }
.list-sub { font-size:0.85rem; color:var(--text-muted); }
.list-sub.online { color:var(--success); }
.list-action {
  background:var(--error); color:#fff; border:none; border-radius:8px;
  padding:6px 12px; font-size:0.85rem; font-weight:600; cursor:pointer;
}
.list-empty { text-align:center; padding:40px 20px; color:var(--text-muted); }

@media(max-width:400px) {
  .fart-btn { width:150px; height:150px; font-size:1.4rem; }
  .minimap { width:160px; height:160px; bottom:15px; right:15px; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
  <div class="logo">💨 I Just Farted</div>
  <div style="width:24px"></div>
</header>

<!-- Slide Menu -->
<nav class="menu" id="menu">
  <div class="menu-item" data-action="add-friend">👥 Add Friends</div>
  <div class="menu-item" data-action="friends">📋 Friends List</div>
  <div class="menu-item" data-action="history">📍 Fart History</div>
  <div class="menu-item" data-action="clear">🗑️ Clear History</div>
  <div class="menu-item" data-action="about">ℹ️ About</div>
</nav>
<div class="menu-overlay" id="overlay"></div>

<!-- Main Content -->
<main class="main">
  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Stream Status</span>
      <span class="status-value">
        <span id="statusText">Offline</span>
        <span class="status-dot" id="statusDot"></span>
      </span>
    </div>
    <div style="display:flex;justify-content:center">
      <div class="toggle" id="toggle"><div class="toggle-knob"></div></div>
    </div>
  </div>

  <div class="button-area">
    <button class="fart-btn disabled" id="fartBtn">FART</button>
    <div class="fart-ring" id="fartRing"></div>
    <div class="fart-counter">Total Farts: <strong id="fartCount">0</strong></div>
  </div>

  <button class="report-btn disabled" id="reportBtn">📝 Report a Fart Sighting</button>
</main>

<!-- Mini Map -->
<div class="minimap" id="minimap">
  <button class="minimap-close" id="minimapClose">✕</button>
  <div id="map"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Add Friend Modal -->
<div class="modal" id="addFriendModal">
  <div class="modal-box">
    <div class="modal-title">👥 Add Friend</div>
    <input class="modal-input" id="friendInput" type="text" placeholder="Enter username">
    <div class="modal-actions">
      <button class="modal-btn cancel" data-close="addFriendModal">Cancel</button>
      <button class="modal-btn confirm" id="addFriendBtn">Add</button>
    </div>
  </div>
</div>

<!-- Friends Modal -->
<div class="modal" id="friendsModal">
  <div class="modal-box">
    <div class="modal-title">📋 Friends List</div>
    <div class="list" id="friendsList"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" data-close="friendsModal">Close</button>
    </div>
  </div>
</div>

<!-- History Modal -->
<div class="modal" id="historyModal">
  <div class="modal-box">
    <div class="modal-title">📍 Fart History</div>
    <div class="list" id="historyList"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" data-close="historyModal">Close</button>
    </div>
  </div>
</div>

<!-- Report Modal -->
<div class="modal" id="reportModal">
  <div class="modal-box">
    <div class="modal-title">📝 Report Fart</div>
    <textarea class="modal-input" id="reportText" placeholder="Describe the incident..." rows="3" style="resize:none"></textarea>
    <input class="modal-input" id="reportPhoto" type="file" accept="image/*">
    <div class="modal-actions">
      <button class="modal-btn cancel" data-close="reportModal">Cancel</button>
      <button class="modal-btn confirm" id="submitReportBtn">Submit</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function() {
  'use strict';

  // ===========================================
  // API ENDPOINTS - CONNECT YOUR SERVER HERE
  // ===========================================
  var API = {
    // Replace these with your actual endpoints
    BASE_URL: '', // e.g., 'https://api.yourserver.com'
    
    broadcastFart: function(data) {
      // POST /api/farts { lat, lng, timestamp, type, note }
      // For now, save locally
      return Promise.resolve({ success: true, id: Date.now() });
    },
    
    getFarts: function() {
      // GET /api/farts
      return Promise.resolve(Storage.getPins());
    },
    
    addFriend: function(username) {
      // POST /api/friends { username }
      return Promise.resolve({ success: true, id: Date.now(), online: Math.random() > 0.5 });
    },
    
    getFriends: function() {
      // GET /api/friends
      return Promise.resolve(Storage.getFriends());
    },
    
    removeFriend: function(id) {
      // DELETE /api/friends/:id
      return Promise.resolve({ success: true });
    },
    
    notifyFriends: function(fartId) {
      // POST /api/notify { fartId }
      return Promise.resolve({ notified: Storage.getFriends().filter(f => f.online).length });
    }
  };

  // ===========================================
  // LOCAL STORAGE (will be replaced by API)
  // ===========================================
  var Storage = {
    PINS_KEY: 'ijf_pins_v2',
    FRIENDS_KEY: 'ijf_friends_v2',
    
    getPins: function() {
      try { return JSON.parse(localStorage.getItem(this.PINS_KEY) || '[]'); }
      catch(e) { return []; }
    },
    savePins: function(pins) {
      localStorage.setItem(this.PINS_KEY, JSON.stringify(pins));
    },
    addPin: function(pin) {
      var pins = this.getPins();
      pins.push(pin);
      this.savePins(pins);
      return pin;
    },
    clearPins: function() {
      this.savePins([]);
    },
    
    getFriends: function() {
      try { return JSON.parse(localStorage.getItem(this.FRIENDS_KEY) || '[]'); }
      catch(e) { return []; }
    },
    saveFriends: function(friends) {
      localStorage.setItem(this.FRIENDS_KEY, JSON.stringify(friends));
    },
    addFriend: function(friend) {
      var friends = this.getFriends();
      friends.push(friend);
      this.saveFriends(friends);
      return friend;
    },
    removeFriend: function(id) {
      var friends = this.getFriends().filter(function(f) { return f.id !== id; });
      this.saveFriends(friends);
    }
  };

  // ===========================================
  // DOM ELEMENTS
  // ===========================================
  var $ = function(id) { return document.getElementById(id); };
  
  var hamburger = $('hamburger');
  var menu = $('menu');
  var overlay = $('overlay');
  var toggle = $('toggle');
  var statusText = $('statusText');
  var statusDot = $('statusDot');
  var fartBtn = $('fartBtn');
  var fartRing = $('fartRing');
  var fartCount = $('fartCount');
  var reportBtn = $('reportBtn');
  var minimap = $('minimap');
  var minimapClose = $('minimapClose');
  var toast = $('toast');

  // ===========================================
  // STATE
  // ===========================================
  var state = {
    isLive: false,
    map: null,
    markers: null,
    lastFartTime: 0
  };

  // ===========================================
  // TOAST NOTIFICATIONS
  // ===========================================
  var toastTimer = null;
  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = 'toast ' + (type || 'success') + ' show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toast.classList.remove('show');
    }, 3000);
  }

  // ===========================================
  // MENU
  // ===========================================
  function openMenu() {
    hamburger.classList.add('active');
    menu.classList.add('open');
    overlay.classList.add('show');
  }
  
  function closeMenu() {
    hamburger.classList.remove('active');
    menu.classList.remove('open');
    overlay.classList.remove('show');
  }

  hamburger.addEventListener('click', function() {
    if (menu.classList.contains('open')) closeMenu();
    else openMenu();
  });
  
  overlay.addEventListener('click', closeMenu);

  menu.addEventListener('click', function(e) {
    var item = e.target.closest('.menu-item');
    if (!item) return;
    
    var action = item.dataset.action;
    closeMenu();
    
    switch(action) {
      case 'add-friend':
        $('friendInput').value = '';
        $('addFriendModal').classList.add('show');
        break;
      case 'friends':
        renderFriends();
        $('friendsModal').classList.add('show');
        break;
      case 'history':
        renderHistory();
        $('historyModal').classList.add('show');
        break;
      case 'clear':
        if (confirm('Clear all fart history?')) {
          Storage.clearPins();
          updateCount();
          showToast('🗑️ History cleared', 'success');
        }
        break;
      case 'about':
        showToast('💨 I Just Farted v1.0 Beta', 'success');
        break;
    }
  });

  // ===========================================
  // MODALS
  // ===========================================
  document.addEventListener('click', function(e) {
    if (e.target.dataset.close) {
      $(e.target.dataset.close).classList.remove('show');
    }
  });

  // ===========================================
  // STATUS TOGGLE
  // ===========================================
  toggle.addEventListener('click', function() {
    state.isLive = !state.isLive;
    toggle.classList.toggle('active', state.isLive);
    statusText.textContent = state.isLive ? 'Live' : 'Offline';
    statusDot.classList.toggle('active', state.isLive);
    fartBtn.classList.toggle('disabled', !state.isLive);
    reportBtn.classList.toggle('disabled', !state.isLive);
    showToast(state.isLive ? '🟢 You are now LIVE!' : '⚫ You went offline', state.isLive ? 'success' : 'error');
    if (state.isLive && navigator.vibrate) navigator.vibrate([50, 50, 50]);
  });

  // ===========================================
  // FART BUTTON
  // ===========================================
  fartBtn.addEventListener('click', function() {
    if (!state.isLive) {
      showToast('Turn on Live status first!', 'error');
      return;
    }
    
    var now = Date.now();
    if (now - state.lastFartTime < 600) return;
    state.lastFartTime = now;
    
    // Animation
    playFartAnimation();
    
    // Vibrate
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    
    // Broadcast
    broadcastFart();
  });

  function playFartAnimation() {
    var rect = fartBtn.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var size = 60;
    
    fartRing.style.width = size + 'px';
    fartRing.style.height = size + 'px';
    fartRing.style.left = (cx - size/2) + 'px';
    fartRing.style.top = (cy - size/2) + 'px';
    fartRing.style.opacity = '1';
    fartRing.style.transform = 'scale(1)';
    
    var frame = function() {
      size += 12;
      var opacity = Math.max(0, 1 - size / 400);
      fartRing.style.width = size + 'px';
      fartRing.style.height = size + 'px';
      fartRing.style.left = (cx - size/2) + 'px';
      fartRing.style.top = (cy - size/2) + 'px';
      fartRing.style.opacity = opacity;
      
      if (size < 400) requestAnimationFrame(frame);
      else fartRing.style.opacity = '0';
    };
    requestAnimationFrame(frame);
  }

  function broadcastFart() {
    getLocation(function(coords) {
      var pin = {
        id: Date.now(),
        lat: coords ? coords.latitude : null,
        lng: coords ? coords.longitude : null,
        timestamp: Date.now(),
        type: 'broadcast',
        note: ''
      };
      
      // Save locally (replace with API.broadcastFart when server ready)
      Storage.addPin(pin);
      updateCount();
      
      if (coords) {
        showMiniMap(pin);
      }
      
      showToast('💨 Fart broadcasted!', 'success');
      
      // Notify friends
      var friends = Storage.getFriends();
      var online = friends.filter(function(f) { return f.online; });
      if (online.length > 0) {
        setTimeout(function() {
          showToast('📢 Notified ' + online.length + ' friend' + (online.length > 1 ? 's' : '') + '!', 'success');
        }, 1500);
      }
    });
  }

  // ===========================================
  // GEOLOCATION
  // ===========================================
  function getLocation(callback) {
    if (!navigator.geolocation) {
      callback(null);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      function(pos) { callback(pos.coords); },
      function() { callback(null); },
      { timeout: 10000, enableHighAccuracy: false }
    );
  }

  // ===========================================
  // MINI MAP
  // ===========================================
  function showMiniMap(pin) {
    if (!pin.lat || !pin.lng) return;
    
    // Initialize or reset map
    if (state.map) {
      state.map.remove();
      state.map = null;
    }
    
    state.map = L.map('map', {
      center: [pin.lat, pin.lng],
      zoom: 15,
      zoomControl: false,
      attributionControl: false
    });
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(state.map);
    
    state.markers = L.layerGroup().addTo(state.map);
    
    // Add all pins
    var pins = Storage.getPins().filter(function(p) { return p.lat && p.lng; });
    pins.forEach(function(p) {
      var color = p.type === 'report' ? '#ff4444' : '#00d084';
      var icon = L.divIcon({
        html: '<div style="width:12px;height:12px;border-radius:50%;background:' + color + ';border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>',
        className: '',
        iconSize: [12, 12],
        iconAnchor: [6, 6]
      });
      L.marker([p.lat, p.lng], { icon: icon }).addTo(state.markers);
    });
    
    minimap.classList.add('show');
    
    setTimeout(function() {
      if (state.map) state.map.invalidateSize();
    }, 400);
    
    // Auto hide
    setTimeout(function() {
      minimap.classList.remove('show');
    }, 8000);
  }

  minimapClose.addEventListener('click', function() {
    minimap.classList.remove('show');
  });

  // ===========================================
  // FRIENDS
  // ===========================================
  $('addFriendBtn').addEventListener('click', function() {
    var username = $('friendInput').value.trim();
    if (!username) {
      showToast('Enter a username', 'error');
      return;
    }
    
    var friends = Storage.getFriends();
    var exists = friends.some(function(f) {
      return f.username.toLowerCase() === username.toLowerCase();
    });
    
    if (exists) {
      showToast('Friend already added', 'error');
      return;
    }
    
    Storage.addFriend({
      id: Date.now(),
      username: username,
      online: Math.random() > 0.5,
      addedAt: Date.now()
    });
    
    $('addFriendModal').classList.remove('show');
    showToast('👥 ' + username + ' added!', 'success');
  });

  function renderFriends() {
    var friends = Storage.getFriends();
    var list = $('friendsList');
    
    if (friends.length === 0) {
      list.innerHTML = '<div class="list-empty">No friends yet.<br>Add some from the menu!</div>';
      return;
    }
    
    list.innerHTML = friends.map(function(f) {
      return '<div class="list-item">' +
        '<div class="list-info">' +
          '<div class="list-title">' + escapeHtml(f.username) + '</div>' +
          '<div class="list-sub ' + (f.online ? 'online' : '') + '">' + 
            (f.online ? '🟢 Online' : '⚫ Offline') + '</div>' +
        '</div>' +
        '<button class="list-action" data-remove-friend="' + f.id + '">Remove</button>' +
      '</div>';
    }).join('');
  }

  $('friendsList').addEventListener('click', function(e) {
    if (e.target.dataset.removeFriend) {
      var id = parseInt(e.target.dataset.removeFriend);
      Storage.removeFriend(id);
      renderFriends();
      showToast('Friend removed', 'success');
    }
  });

  // ===========================================
  // HISTORY
  // ===========================================
  function renderHistory() {
    var pins = Storage.getPins().reverse().slice(0, 50);
    var list = $('historyList');
    
    if (pins.length === 0) {
      list.innerHTML = '<div class="list-empty">No farts recorded yet.<br>Press the button to start!</div>';
      return;
    }
    
    list.innerHTML = pins.map(function(p) {
      var date = new Date(p.timestamp);
      var emoji = p.type === 'report' ? '📝' : '💨';
      var typeName = p.type === 'report' ? 'Report' : 'Broadcast';
      var loc = (p.lat && p.lng) ? p.lat.toFixed(4) + ', ' + p.lng.toFixed(4) : 'No location';
      
      return '<div class="list-item">' +
        '<div class="list-info">' +
          '<div class="list-title">' + emoji + ' ' + typeName + '</div>' +
          '<div class="list-sub">' + date.toLocaleString() + '</div>' +
          '<div class="list-sub">' + loc + '</div>' +
          (p.note ? '<div class="list-sub">"' + escapeHtml(p.note) + '"</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }

  // ===========================================
  // REPORT
  // ===========================================
  reportBtn.addEventListener('click', function() {
    if (!state.isLive) {
      showToast('Turn on Live status first!', 'error');
      return;
    }
    $('reportText').value = '';
    $('reportPhoto').value = '';
    $('reportModal').classList.add('show');
  });

  $('submitReportBtn').addEventListener('click', function() {
    var text = $('reportText').value.trim();
    var hasPhoto = $('reportPhoto').files.length > 0;
    
    if (!text && !hasPhoto) {
      showToast('Add a note or photo', 'error');
      return;
    }
    
    getLocation(function(coords) {
      var pin = {
        id: Date.now(),
        lat: coords ? coords.latitude : null,
        lng: coords ? coords.longitude : null,
        timestamp: Date.now(),
        type: 'report',
        note: text || 'Fart sighting reported'
      };
      
      Storage.addPin(pin);
      updateCount();
      $('reportModal').classList.remove('show');
      
      if (coords) showMiniMap(pin);
      showToast('📝 Report submitted!', 'success');
    });
  });

  // ===========================================
  // UTILS
  // ===========================================
  function updateCount() {
    fartCount.textContent = Storage.getPins().length;
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ===========================================
  // INIT
  // ===========================================
  updateCount();
  
  setTimeout(function() {
    showToast('👋 Welcome! Turn on Live to start', 'success');
  }, 500);

})();
</script>
</body>
</html>
